name: Publish Foundry release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(jq -r .version module.json)
          id=$(jq -r .id module.json)
          title=$(jq -r .title module.json)
          tag="v$version"
          notes="RELEASE-NOTES-$version.md"
          test "$GITHUB_REF_NAME" = "$tag"
          test "$(jq -r .download module.json)" = "https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$id.zip"
          jq -r '.esmodules[], .styles[]' module.json | while IFS= read -r asset; do
            git ls-files --error-unmatch -- "$asset" >/dev/null
          done
          mkdir dist
          git archive --format=zip --output="dist/$id.zip" HEAD -- module.json LICENSE "$notes" scripts styles
          cp module.json dist/module.json
          gh release create "$tag" --verify-tag --title "$title $tag" --notes-file "$notes" dist/module.json "dist/$id.zip"
